<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 3-Month Anniversary</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Soft grey dust particles -->
  <canvas id="dust-canvas"></canvas>

  <!-- ===== Entry screen ===== -->
  <div id="entry-screen">
    <div class="entry-content">
      <h1 class="entry-title">Happy 3-Month Anniversary</h1>
      <p class="entry-sub">A little collection of moments</p>
      <button id="start-btn">Start</button>
    </div>
  </div>

  <!-- ===== Main content (hidden at first) ===== -->
  <div id="main-content" class="hidden-start">
    <header class="header">
      <h1>Happy 3-Month Anniversary</h1>
      <p class="subtitle">Click any floating message to read it</p>
    </header>

    <div id="messages-container"></div>

    <!-- Modal -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <button id="close-modal" class="close-btn" aria-label="Close">&times;</button>
        <div class="modal-date" id="modal-date"></div>
        <div class="modal-divider"></div>
        <div class="modal-message" id="modal-message"></div>
      </div>
    </div>

    <!-- ===== Music bar ===== -->
    <div id="music-bar">
      <button id="play-btn" class="music-btn" aria-label="Play / Pause">
        <svg id="icon-play" viewBox="0 0 24 24" width="22" height="22">
          <path fill="currentColor" d="M8 5v14l11-7z"/>
        </svg>
        <svg id="icon-pause" viewBox="0 0 24 24" width="22" height="22" style="display:none">
          <path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>

      <div class="music-info">
        <span id="track-name">Anniversary Song</span>
      </div>

      <div class="volume-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" class="vol-icon">
          <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        </svg>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.7" />
      </div>

      <a id="spotify-link" href="https://open.spotify.com" target="_blank" rel="noopener" title="Open in Spotify">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="#1DB954" d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- Hidden audio (put your song as music.mp3 in the same folder) -->
  <audio id="bg-music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg" />
  </audio>

  <script src="script.js"></script>
</body>
</html>
